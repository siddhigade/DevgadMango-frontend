<a
[routerLink]="['/products', product.id]"
  class="group relative flex h-full flex-col overflow-hidden"
>
  <div class="aspect-square w-full overflow-hidden">
    @if (product.imageUrl) {
      <img
        [src]="product.imageUrl"
        [alt]="product.name"
        class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
      />
    } @else {
      <div class="flex h-full w-full items-center justify-center bg-sandDeep text-ink/30">
        <span class="font-display text-sm">Kokan Delights</span>
      </div>
    }
  </div>

  <div class="relative flex flex-1 flex-col p-4 pt-8" [style.background]="accentColor()">
    <h3 class="font-display text-lg font-bold leading-tight text-white md:text-xl">
      {{ product.name }}
    </h3>
    @if (product.description) {
      <p class="mt-2 line-clamp-2 text-sm text-white/85">{{ product.description }}</p>
    }
    <p class="mt-auto pt-3 font-display text-lg font-bold text-white">
      Rs.{{ product.price.toFixed(2) }}
    </p>

    <!-- Cart icon, positioned relative to THIS panel (not the whole card),
         so it always sits exactly on the image/panel seam no matter how
         tall the card ends up being. -->
    <div
      class="absolute -top-5 right-4 flex h-11 w-11 items-center justify-center rounded bg-white shadow-md transition group-hover:bg-brand group-hover:text-white"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
    </div>
  </div>

  @if ((product.stock ?? 0) <= 0) {
    <span class="absolute left-4 top-4 rounded-full bg-white/90 px-3 py-1 text-xs font-semibold uppercase text-ink">
      Sold out
    </span>
  }
</a>
