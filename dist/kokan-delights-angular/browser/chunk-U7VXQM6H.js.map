<a
[routerLink]="['/products']"
  [queryParams]="{ category: category.id }"
  class="group block overflow-hidden border border-sandDeep"
>
  <div class="aspect-[4/3] w-full overflow-hidden">
    @if (category.imageUrl) {
      <img
        [src]="category.imageUrl"
        [alt]="category.name"
        class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
      />
    }
  </div>
  <div class="p-4 text-center" [style.background]="accentColor()">
    <span class="font-display text-base font-bold uppercase tracking-wide text-white md:text-lg">
      {{ category.name }}
    </span>
  </div>
</a>
